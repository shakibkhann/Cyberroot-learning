<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CyberRoot — Master Cybersecurity From Zero to Advanced</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e12; --panel:#0f151b; --panel-2:#131a21; --line:#212b33;
  --text:#dbe4ea; --muted:#7c8b98; --muted-2:#54626e;
  --signal:#00d9c0; --signal-dim:#0a3d38; --amber:#ffb020; --amber-dim:#3d2f0a;
  --danger:#ff5d5d; --danger-dim:#3d1414; --violet:#9d7bff;
  --radius:3px; --mono:'JetBrains Mono',monospace; --sans:'Space Grotesk',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="light"]){ }
:root[data-theme="light"]{
  --bg:#f3f5f6; --panel:#ffffff; --panel-2:#eef1f2; --line:#d8dee2;
  --text:#141c22; --muted:#59666f; --muted-2:#8a97a0;
  --signal-dim:#d5f5f1; --amber-dim:#fff2d9; --danger-dim:#ffe4e4;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f3f5f6; --panel:#ffffff; --panel-2:#eef1f2; --line:#d8dee2;
    --text:#141c22; --muted:#59666f; --muted-2:#8a97a0;
    --signal-dim:#d5f5f1; --amber-dim:#fff2d9; --danger-dim:#ffe4e4;
  }
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;}
button{font-family:var(--sans);cursor:pointer;}
code,.mono{font-family:var(--mono);}
::selection{background:var(--signal);color:#04231f;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;}

#app{min-height:100%;}
.shell{display:flex;min-height:100vh;}

/* ---------- Sidebar ---------- */
.sidebar{
  width:224px;flex:none;background:var(--panel);border-right:1px solid var(--line);
  padding:18px 0 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
  padding-top:calc(18px + env(safe-area-inset-top,0px));
}
.brand{display:flex;align-items:center;gap:10px;padding:0 18px 16px;border-bottom:1px solid var(--line);margin-bottom:10px;}
.brand-mark{width:26px;height:26px;flex:none;color:var(--signal);}
.brand-name{font-weight:700;font-size:16px;letter-spacing:.2px;}
.brand-name b{color:var(--signal);}
.navlist{display:flex;flex-direction:column;gap:1px;padding:6px 10px;flex:1;}
.navlink{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius);color:var(--muted);font-size:13.5px;font-weight:500;border-left:2px solid transparent;}
.navlink svg{width:16px;height:16px;flex:none;opacity:.85;}
.navlink:hover{color:var(--text);background:var(--panel-2);}
.navlink.active{color:var(--signal);background:var(--signal-dim);border-left-color:var(--signal);}
.side-foot{padding:12px 14px 4px;border-top:1px solid var(--line);margin-top:8px;}
.userchip{display:flex;align-items:center;gap:9px;padding:8px;border-radius:var(--radius);background:var(--panel-2);}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--signal),var(--violet));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#04231f;flex:none;}
.userchip-meta{min-width:0;}
.userchip-name{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.userchip-lvl{font-size:11px;color:var(--muted);font-family:var(--mono);}

/* ---------- Topbar (mobile) ---------- */
.topbar{display:none;position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));align-items:center;justify-content:space-between;gap:10px;}
.topbar .brand{border:none;padding:0;margin:0;}
.icon-btn{width:34px;height:34px;border-radius:var(--radius);border:1px solid var(--line);background:var(--panel-2);color:var(--text);display:flex;align-items:center;justify-content:center;}
.icon-btn svg{width:17px;height:17px;}

.mobile-drawer{display:none;position:fixed;inset:0;z-index:40;}
.mobile-drawer.open{display:block;}
.mobile-drawer .scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);}
.mobile-drawer .panel{position:absolute;left:0;top:0;bottom:0;width:250px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);}

/* ---------- Main ---------- */
.main{flex:1;min-width:0;}
.topstrip{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 26px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:10;}
.searchbox{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:7px 10px;width:min(360px,42vw);}
.searchbox svg{width:14px;height:14px;color:var(--muted);flex:none;}
.searchbox input{background:transparent;border:none;outline:none;color:var(--text);font-size:13px;width:100%;font-family:var(--sans);}
.topstrip-right{display:flex;align-items:center;gap:10px;}
.chip{font-family:var(--mono);font-size:11px;padding:4px 8px;border-radius:var(--radius);background:var(--signal-dim);color:var(--signal);border:1px solid transparent;display:flex;align-items:center;gap:5px;}
.chip.amber{background:var(--amber-dim);color:var(--amber);}
.themebtn{width:32px;height:32px;border-radius:var(--radius);border:1px solid var(--line);background:var(--panel);color:var(--text);display:flex;align-items:center;justify-content:center;}
.themebtn svg{width:15px;height:15px;}

.content{padding:26px;max-width:1180px;margin:0 auto;}
.content.wide{max-width:1320px;}

/* ---------- Type ---------- */
h1,h2,h3,h4{font-family:var(--sans);margin:0;line-height:1.2;}
.h1{font-size:30px;font-weight:700;letter-spacing:-.3px;}
.h2{font-size:20px;font-weight:700;}
.h3{font-size:15px;font-weight:600;}
.lead{color:var(--muted);font-size:14.5px;line-height:1.6;max-width:60ch;}
.eyebrow{font-family:var(--mono);font-size:11px;color:var(--signal);letter-spacing:.3px;}
.small{font-size:12.5px;color:var(--muted);}
.section-gap{margin-top:34px;}

/* ---------- Cards / grid ---------- */
.grid{display:grid;gap:14px;}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:980px){.grid.cols-4{grid-template-columns:repeat(2,1fr);}.grid.cols-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.grid.cols-4,.grid.cols-3,.grid.cols-2{grid-template-columns:1fr;}}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;}
.card.hoverable:hover{border-color:var(--signal);}
.card.flush{padding:0;overflow:hidden;}
.statcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;}
.statcard .num{font-family:var(--mono);font-size:24px;font-weight:700;color:var(--signal);}
.statcard .lbl{font-size:12px;color:var(--muted);margin-top:3px;}

.diff{font-family:var(--mono);font-size:10.5px;padding:2px 7px;border-radius:2px;display:inline-block;}
.diff.beg{background:var(--signal-dim);color:var(--signal);}
.diff.int{background:var(--amber-dim);color:var(--amber);}
.diff.adv{background:var(--danger-dim);color:var(--danger);}

.tag{font-family:var(--mono);font-size:10.5px;color:var(--muted);border:1px solid var(--line);padding:2px 7px;border-radius:2px;}

.btn{display:inline-flex;align-items:center;gap:7px;background:var(--signal);color:#04231f;border:none;padding:10px 16px;border-radius:var(--radius);font-weight:600;font-size:13.5px;}
.btn:hover{filter:brightness(1.08);}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);}
.btn.ghost:hover{border-color:var(--signal);color:var(--signal);}
.btn.sm{padding:7px 11px;font-size:12.5px;}
.btn.block{width:100%;justify-content:center;}
.btn.danger{background:var(--danger);color:#2a0808;}
.btn[disabled]{opacity:.45;pointer-events:none;}

.progress{height:6px;background:var(--panel-2);border-radius:4px;overflow:hidden;border:1px solid var(--line);}
.progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--signal),var(--violet));}

.termbox{background:#05080a;border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;font-family:var(--mono);font-size:12.5px;color:#8fffef;overflow-x:auto;line-height:1.7;}
:root[data-theme="light"] .termbox{background:#0e1419;}
.termbox .p{color:var(--muted-2);}
pre{margin:0;white-space:pre-wrap;word-break:break-word;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);}
th{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:500;}

.hr{height:1px;background:var(--line);border:none;margin:22px 0;}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;}
.tab{padding:9px 13px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;}
.tab.active{color:var(--signal);border-color:var(--signal);}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.pill{font-size:12px;padding:6px 12px;border-radius:20px;border:1px solid var(--line);color:var(--muted);}
.pill.active{border-color:var(--signal);color:var(--signal);background:var(--signal-dim);}

input[type=text],input[type=email],input[type=password],textarea,select{
  width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);
  padding:10px 11px;color:var(--text);font-family:var(--sans);font-size:13.5px;outline:none;
}
input:focus,textarea:focus,select:focus{border-color:var(--signal);}
label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:5px;}
.field{margin-bottom:13px;}

.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px;}
.badge{text-align:center;padding:12px 6px;border-radius:var(--radius);border:1px solid var(--line);}
.badge.locked{opacity:.35;}
.badge .ic{font-size:20px;}
.badge .nm{font-size:10.5px;color:var(--muted);margin-top:5px;}

.qopt{display:block;width:100%;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;font-size:13.5px;margin-bottom:8px;color:var(--text);}
.qopt:hover{border-color:var(--signal);}
.qopt.correct{border-color:var(--signal);background:var(--signal-dim);}
.qopt.wrong{border-color:var(--danger);background:var(--danger-dim);}

.footer-note{margin-top:60px;padding:18px 0 10px;border-top:1px solid var(--line);color:var(--muted-2);font-size:12px;}

.hero{padding:54px 0 40px;border-bottom:1px solid var(--line);margin-bottom:36px;position:relative;}
.hero-eyebrow{font-family:var(--mono);font-size:12px;color:var(--signal);margin-bottom:14px;letter-spacing:.5px;}
.hero-title{font-size:44px;font-weight:700;letter-spacing:-1px;line-height:1.05;max-width:14ch;}
.hero-sub{margin-top:16px;font-size:15px;color:var(--muted);max-width:56ch;line-height:1.6;}
.hero-actions{margin-top:24px;display:flex;gap:10px;flex-wrap:wrap;}
@media(max-width:640px){.hero-title{font-size:32px;}}

.roadmap-row{display:flex;gap:14px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--line);}
.roadmap-row:last-child{border-bottom:none;}
.lvl-num{font-family:var(--mono);font-size:12px;color:var(--bg);background:var(--signal);width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;font-weight:700;}
.lvl-num.locked{background:var(--panel-2);color:var(--muted-2);border:1px solid var(--line);}
.topic-chip{display:inline-block;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:var(--radius);padding:5px 9px;margin:3px 5px 0 0;}
.topic-chip:hover{border-color:var(--signal);color:var(--signal);}
.topic-chip.done{color:var(--signal);border-color:var(--signal-dim);background:var(--signal-dim);}

@media(max-width:900px){
  .sidebar{display:none;}
  .topbar{display:flex;}
  .content{padding:18px;}
  .topstrip{padding:12px 16px;}
  .searchbox{width:100%;}
}
</style>
</head>

<script>
/* ============================== DATA ============================== */
const ICONS = {

function ic(name,cls){return `<svg class="${cls||''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||''}</svg>`;}

const ROADMAP = [
 {lvl:0,title:'Computer Fundamentals',topics:['Computer hardware','CPU & RAM','Storage','Operating systems','Files & directories','Processes','Users & permissions','Virtualization','Basic troubleshooting']},

 {lvl:10,title:'Penetration Testing',topics:['Recon methodology','Enumeration','Vulnerability assessment','Controlled exploitation (lab-only)','Reporting & remediation']},

function topicDiff(i){return i%3===0?'beg':(i%3===1?'int':'adv');}

const TOPICS = [
 {id:'l0-computer-hardware',lvl:0,title:'Computer hardware',diff:'beg',
  what:'The physical components of a computer — motherboard, CPU, RAM, storage, power supply, and I/O devices — that everything else runs on top of.',
  why:'Security issues at the hardware layer (firmware implants, malicious USB devices, physical tampering) bypass every software control, so defenders need at least a working mental model of it.',
  how:'The motherboard connects the CPU, memory, and peripherals over buses; the CPU executes instructions fetched from RAM, and storage persists data when power is removed.',

  commands:[],

  mistakes:'Forgetting that RAM contents (including encryption keys, credentials) are lost on power-off but can be captured beforehand.',

  interview:['Why is RAM interesting to a forensic investigator during an active incident?']},
 {id:'l0-storage',lvl:0,title:'Storage',diff:'beg',
  what:'Non-volatile media (HDD, SSD, USB, cloud storage) that persists data even when the device is powered off.',
  why:'Storage is where most forensic evidence lives, and misconfigured or unencrypted storage is a leading cause of data breaches.',
  how:'Data is written in blocks/sectors managed by a filesystem, which tracks where each file physically lives and its metadata.',
  terms:['Filesystem','Sector','Encryption at rest','Wear leveling (SSD)'],
  commands:['df -h','lsblk'],
  tools:['Disk Management','fdisk'],

  lab:'Check whether your own machine has full-disk encryption enabled and note the method used.',

 {id:'l0-operating-systems',lvl:0,title:'Operating systems',diff:'beg',
  what:'The software layer (Windows, Linux, macOS, etc.) that manages hardware resources and provides the environment applications run in.',
  why:'The OS enforces the core security boundaries — user accounts, permissions, process isolation — that almost every other control depends on.',

  commands:['uname -a','systeminfo (Windows)'],
  tools:['Task Manager','Activity Monitor'],
  mistakes:'Running everyday tasks as an administrator/root account instead of a least-privileged standard user.',
  risks:'A kernel-level compromise (rootkit) can hide from nearly all user-space security tools.',

/* ============================== STATE ============================== */
const LS_KEY='cyberroot_state_v1';
function defaultState(){
  return {
    user:null, // {name,email,role}
    theme:'dark',
    xp:0,
    topicsDone:[], labsDone:[], quizResults:[], ctfSolved:[], bookmarks:[], notesDone:[],
    lastActive:null, streak:0,
    adminNotes:[], adminTools:[]
  };
}
let STATE = loadState();
function loadState(){
  try{ const raw=localStorage.getItem(LS_KEY); if(!raw) return defaultState();
    const parsed = JSON.parse(raw); return Object.assign(defaultState(),parsed);
  }catch(e){ return defaultState(); }
}
function saveState(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(STATE)); }catch(e){}
}
function bumpStreak(){
  const today=new Date().toDateString();
  if(STATE.lastActive===today) return;
  const y=new Date(Date.now()-86400000).toDateString();
  STATE.streak = (STATE.lastActive===y) ? STATE.streak+1 : 1;
  STATE.lastActive=today; saveState();
}
function addXp(n){ STATE.xp += n; saveState(); }
function levelFromXp(xp){
  const level = Math.max(1, Math.floor(Math.sqrt(xp/25))+1);
  const cur = 25*Math.pow(level-1,2);
  const next = 25*Math.pow(level,2);
  const pct = Math.min(100, Math.round(((xp-cur)/(next-cur))*100));
  return {level, pct, next};
}
function titleForLevel(l){
  const t=['Recruit','Analyst-in-Training','Junior Analyst','Network Explorer','SOC Trainee','Detection Novice','Threat Tracker','Incident Handler','Senior Analyst','Security Engineer'];
  return t[Math.min(t.length-1,l-1)];
}

let QUIZ_RUNTIME = {};
function pageQuiz(id){
  const q = QUIZZES.find(x=>x.id===id);
  if(!q) return notFound('Quiz');
  if(!QUIZ_RUNTIME[id]) QUIZ_RUNTIME[id] = {idx:0, score:0, answered:false, finished:false};
  const r = QUIZ_RUNTIME[id];
  if(r.finished){
    return `
      <a class="small" href="#/quizzes">← Back to quizzes</a>
      <div class="card section-gap" style="text-align:center;padding:36px 20px;">
        <div class="eyebrow mono">RESULT</div>
        <div class="h1" style="margin-top:10px;">${r.score} / ${q.qs.length}</div>
        <p class="lead" style="margin:10px auto;">${scoreMessage(r.score,q.qs.length)}</p>
        <div style="display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap;">
          <button class="btn ghost" onclick="restartQuiz('${id}')">Retake quiz</button>
          <a class="btn" href="#/quizzes">More quizzes</a>
        </div>
      </div>`;
  }
  const cur = q.qs[r.idx];
  const optsHtml = cur.opts.map((o,i)=>{
    let cls='qopt';
    if(r.answered){
      if(i===cur.a) cls+=' correct';
      else if(i===r.picked) cls+=' wrong';
    }
    return `<button class="${cls}" ${r.answered?'disabled':''} onclick="answerQuiz('${id}',${i})">${o}</button>`;
  }).join('');
  return `
    <a class="small" href="#/quizzes">← Back to quizzes</a>
    <div style="margin-top:14px;display:flex;justify-content:space-between;align-items:center;">
      <div class="h2">${q.title}</div>
      <div class="small mono">Q${r.idx+1}/${q.qs.length}</div>
    </div>
    <div class="progress section-gap"><i style="width:${(r.idx/q.qs.length)*100}%;"></i></div>
    <div class="card section-gap">
      <div class="h3">${cur.q}</div>
      <div style="margin-top:14px;">${optsHtml}</div>
      ${r.answered?`<div class="card" style="margin-top:12px;background:var(--panel-2);"><span class="small">${cur.exp}</span></div>
        <button class="btn" style="margin-top:14px;" onclick="nextQuiz('${id}')">${r.idx+1<q.qs.length?'Next question':'See results'}</button>`:''}
    </div>
  `;
}
function scoreMessage(s,total){
  const pct=s/total;
  if(pct===1) return 'Perfect score — this topic is locked in.';
  if(pct>=0.6) return 'Solid work. Review the ones you missed and retake if you like.';
  return 'Worth a revisit — check the related topic notes before retaking.';
}
function answerQuiz(id,i){
  const r=QUIZ_RUNTIME[id]; if(r.answered) return;
  r.answered=true; r.picked=i;
  const q=QUIZZES.find(x=>x.id===id);
  if(i===q.qs[r.idx].a) r.score++;
  render();
}
function nextQuiz(id){
  const r=QUIZ_RUNTIME[id]; const q=QUIZZES.find(x=>x.id===id);
  if(r.idx+1<q.qs.length){ r.idx++; r.answered=false; r.picked=null; }
  else{
    r.finished=true;
    STATE.quizResults.push({id,score:r.score,total:q.qs.length,date:Date.now()});
    addXp(r.score*10); bumpStreak(); saveState();
  }
  render();
}
function restartQuiz(id){ QUIZ_RUNTIME[id]={idx:0,score:0,answered:false,finished:false}; render(); }

        <div class="h3">XP to next level</div>
        <div class="progress" style="margin-top:10px;"><i style="width:${lvl.pct}%;"></i></div>
        <div class="small" style="margin-top:6px;">${s.xp} XP · ${lvl.next-s.xp} XP to level ${lvl.level+1}</div>
      </div>
    </div>

    <div class="grid cols-2 section-gap">
      <div class="card">
        <div class="h3">Weak areas</div>
        ${weak.length? `<ul style="margin:10px 0 0;padding-left:18px;color:var(--muted);font-size:13px;line-height:1.9;">${weak.map(w=>`<li>${w}</li>`).join('')}</ul>`
          : `<p class="small" style="margin-top:8px;">Take a few quizzes to surface weak areas here.</p>`}
      </div>
      <div class="card">
        <div class="h3">Recommended next lesson</div>
        ${nextTopic? `<a class="topic-chip" style="margin-top:10px;" href="#/learn/${nextTopic.id}">${nextTopic.title}</a>` : `<p class="small" style="margin-top:8px;">You've completed every topic — nice work.</p>`}
      </div>
    </div>

    <div class="card section-gap">
      <div class="h3">Badges</div>
      <div class="badge-grid section-gap">
        ${BADGES.map(b=>{
          const unlocked = b.cond(s);
          return `<div class="badge ${unlocked?'':'locked'}"><div class="ic">${b.ic}</div><div class="nm">${b.name}</div></div>`;
        }).join('')}
      </div>
    </div>

    ${roadmapPct>=100 ? certificateCard() : ''}
  `;
}
function weakTopicsFromQuiz(){
  const byTopic={};
  STATE.quizResults.forEach(r=>{
    const q=QUIZZES.find(x=>x.id===r.id); if(!q) return;
    byTopic[q.topic]=byTopic[q.topic]||{score:0,total:0};
    byTopic[q.topic].score+=r.score; byTopic[q.topic].total+=r.total;
  });
  return Object.entries(byTopic).filter(([k,v])=>v.score/v.total<0.7).map(([k,v])=>`${k} — ${Math.round(v.score/v.total*100)}% avg`);
}
function certificateCard(){
  const s=STATE;
  const certId = 'CR-'+(s.user?s.user.email.length:0)+'-'+String(s.xp).padStart(5,'0');
  return `<div class="card section-gap" style="border:1px solid var(--signal);text-align:center;padding:30px 20px;">
    <div class="eyebrow mono">CERTIFICATE OF COMPLETION</div>
    <div class="h1" style="margin-top:12px;">CyberRoot Fundamentals Path</div>
    <p class="lead" style="margin:10px auto;">Awarded to <b style="color:var(--text);">${s.user?s.user.name:'Guest Learner'}</b> for completing every topic on the roadmap.</p>
    <p class="small mono" style="margin-top:10px;">Certificate ID: ${certId} · CyberRoot internal certificate, not an accredited industry certification.</p>
  </div>`;
}

/* ============================== PAGE: SEARCH ============================== */
function pageSearch(qStr){
  const qv = (qStr||'').toLowerCase().trim();
  const results = [];
  if(qv){
    TOPICS.forEach(t=>{ if(t.title.toLowerCase().includes(qv)) results.push({type:'Topic',title:t.title,href:'#/learn/'+t.id}); });
    LABS.forEach(l=>{ if(l.title.toLowerCase().includes(qv)) results.push({type:'Lab',title:l.title,href:'#/lab/'+l.id}); });
    [...TOOLS,...STATE.adminTools].forEach(t=>{ if(t.name.toLowerCase().includes(qv)) results.push({type:'Tool',title:t.name,href:'#/tools'}); });
    [...NOTES,...STATE.adminNotes].forEach(n=>{ if(n.title.toLowerCase().includes(qv)) results.push({type:'Note',title:n.title,href:'#/notes'}); });
    QUIZZES.forEach(q=>{ if(q.title.toLowerCase().includes(qv)) results.push({type:'Quiz',title:q.title,href:'#/quiz/'+q.id}); });
    PROJECTS.forEach(p=>{ if(p.title.toLowerCase().includes(qv)) results.push({type:'Project',title:p.title,href:'#/projects'}); });
    ROADMAP.forEach(r=>{ if(r.title.toLowerCase().includes(qv)) results.push({type:'Roadmap module',title:r.title,href:'#/roadmap'}); });
  }
  return `
    <div class="eyebrow mono">// SEARCH</div>
    <h1 class="h1" style="margin-top:6px;">Search CyberRoot</h1>
    <div style="margin-top:16px;"><input type="text" id="searchPage" value="${escapeHtml(qStr||'')}" placeholder="Search topics, labs, tools, notes, quizzes, projects..." onkeydown="if(event.key==='Enter'){nav('search/'+encodeURIComponent(this.value))}"></div>
    <button class="btn sm" style="margin-top:10px;" onclick="nav('search/'+encodeURIComponent(document.getElementById('searchPage').value))">Search</button>
    <div class="section-gap">
      ${qv? (results.length? `<div class="card flush"><table><tr><th>Type</th><th>Result</th></tr>${results.map(r=>`<tr><td><span class="tag">${r.type}</span></td><td><a href="${r.href}">${r.title}</a></td></tr>`).join('')}</table></div>` : `<p class="small">No results for "${escapeHtml(qStr)}".</p>`) : `<p class="small">Start typing to search across the whole platform.</p>`}
    </div>
  `;
}

/* ============================== PAGE: PROFILE / AUTH ============================== */
function pageProfile(){
  const s = STATE;
  if(!s.user){
    return `
    <div class="eyebrow mono">// PROFILE</div>
    <h1 class="h1" style="margin-top:6px;">Sign up or log in</h1>
    <p class="lead" style="margin-top:8px;">This is a client-side demo account — data is stored only in your browser, not on a server.</p>
    <div class="grid cols-2 section-gap">
      <div class="card">
        <div class="h3">Create account</div>
        <div class="field section-gap"><label>Name</label><input type="text" id="suName" placeholder="Your name"></div>
        <div class="field"><label>Email</label><input type="email" id="suEmail" placeholder="you@example.com"></div>
        <div class="field"><label>Password</label><input type="password" id="suPass" placeholder="••••••••"></div>
        <button class="btn block" onclick="signUp()">Sign up</button>
        <button class="btn ghost block" style="margin-top:8px;" onclick="googleLogin()">Continue with Google (demo)</button>
      </div>
      <div class="card">
        <div class="h3">Log in</div>
        <div class="field section-gap"><label>Email</label><input type="email" id="liEmail" placeholder="you@example.com"></div>
        <div class="field"><label>Password</label><input type="password" id="liPass" placeholder="••••••••"></div>
        <button class="btn block" onclick="logIn()">Log in</button>
        <a class="small" style="display:block;margin-top:10px;" href="javascript:void(0)" onclick="forgotPassword()">Forgot password?</a>
      </div>
    </div>`;
  }
  const lvl = levelFromXp(s.xp);
  const bookmarkedTopics = s.bookmarks.filter(b=>b.startsWith('topic:')).map(b=>TOPICS.find(t=>t.id===b.split(':')[1])).filter(Boolean);
  return `
    <div class="eyebrow mono">// PROFILE</div>
    <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;">
      <div>
        <h1 class="h1" style="margin-top:6px;">${s.user.name}</h1>
        <p class="small" style="margin-top:6px;">${s.user.email} · <span class="tag">${s.user.role}</span></p>
      </div>
      <button class="btn ghost sm" onclick="logOut()">Log out</button>
    </div>
    <div class="grid cols-4 section-gap">
      <div class="statcard"><div class="num">LVL ${lvl.level}</div><div class="lbl">${titleForLevel(lvl.level)}</div></div>
      <div class="statcard"><div class="num">${s.xp}</div><div class="lbl">Total XP</div></div>
      <div class="statcard"><div class="num">${s.labsDone.length}</div><div class="lbl">Labs completed</div></div>
      <div class="statcard"><div class="num">${s.ctfSolved.length}</div><div class="lbl">Flags captured</div></div>
    </div>
    <div class="card section-gap">
      <div class="h3">Role (demo)</div>
      <p class="small" style="margin-top:6px;">Switch role to preview the Admin panel — this is a local demo toggle, not real authorization.</p>
      <div style="display:flex;gap:8px;margin-top:10px;">
        <button class="btn sm ${s.user.role==='student'?'':'ghost'}" onclick="setRole('student')">Student</button>
        <button class="btn sm ${s.user.role==='instructor'?'':'ghost'}" onclick="setRole('instructor')">Instructor</button>
        <button class="btn sm ${s.user.role==='admin'?'':'ghost'}" onclick="setRole('admin')">Admin</button>
      </div>
    </div>
    <div class="card section-gap">
      <div class="h3">Bookmarked topics</div>
      ${bookmarkedTopics.length? bookmarkedTopics.map(t=>`<a class="topic-chip" href="#/learn/${t.id}">${t.title}</a>`).join('') : `<p class="small" style="margin-top:8px;">No bookmarks yet.</p>`}
    </div>
    <div class="card section-gap">
      <div class="h3">Learning history</div>
      <table style="margin-top:8px;"><tr><th>Quiz</th><th>Score</th></tr>
        ${s.quizResults.slice(-8).reverse().map(r=>{const q=QUIZZES.find(x=>x.id===r.id);return `<tr><td>${q?q.title:r.id}</td><td>${r.score}/${r.total}</td></tr>`;}).join('') || '<tr><td colspan="2" class="small">No quiz attempts yet.</td></tr>'}
      </table>
    </div>
  `;
}
function signUp(){
  const name=document.getElementById('suName').value.trim();
  const email=document.getElementById('suEmail').value.trim();
  if(!name||!email){ alert('Please enter a name and email.'); return; }
  STATE.user={name,email,role:'student'}; bumpStreak(); saveState(); render();
}
function googleLogin(){
  STATE.user={name:'Google User',email:'demo.google@cyberroot.dev',role:'student'}; bumpStreak(); saveState(); render();
}
function logIn(){
  const email=document.getElementById('liEmail').value.trim();
  if(!email){ alert('Please enter your email.'); return; }
  STATE.user={name:email.split('@')[0],email,role:'student'}; bumpStreak(); saveState(); render();
}
function forgotPassword(){ alert('This is a client-side demo — no email system is connected. In a production build this would trigger a password-reset email.'); }
function logOut(){ STATE.user=null; saveState(); render(); }
function setRole(r){ STATE.user.role=r; saveState(); render(); }

/* ============================== PAGE: ADMIN ============================== */
function pageAdmin(){
  const s=STATE;
  if(!s.user || s.user.role!=='admin'){
    return `<div class="card"><div class="h3">Admin access required</div><p class="small" style="margin-top:8px;">Switch to the Admin role from your Profile page to preview this panel.</p><a class="btn sm" style="margin-top:12px;" href="#/profile">Go to profile</a></div>`;
  }
  return `
    <div class="eyebrow mono">// ADMIN</div>
    <h1 class="h1" style="margin-top:6px;">Admin Panel</h1>
    <p class="lead" style="margin-top:8px;">Content added here is stored locally in this browser and appears in Notes/Tools immediately — a real deployment would write to a database via the API endpoints described below.</p>

    <div class="grid cols-4 section-gap">
      <div class="statcard"><div class="num">${TOPICS.length}</div><div class="lbl">Topics</div></div>
      <div class="statcard"><div class="num">${LABS.length}</div><div class="lbl">Labs</div></div>
      <div class="statcard"><div class="num">${QUIZZES.length}</div><div class="lbl">Quizzes</div></div>
      <div class="statcard"><div class="num">${NOTES.length+s.adminNotes.length}</div><div class="lbl">Notes</div></div>
    </div>

    <div class="grid cols-2 section-gap">
      <div class="card">
        <div class="h3">Add a note</div>
        <div class="field section-gap"><label>Title</label><input type="text" id="anTitle"></div>
        <div class="field"><label>Category</label><input type="text" id="anCat" placeholder="e.g. Networking"></div>
        <div class="field"><label>Body</label><textarea id="anBody" rows="3"></textarea></div>
        <button class="btn block" onclick="addAdminNote()">Publish note</button>
      </div>
      <div class="card">
        <div class="h3">Add a tool</div>
        <div class="field section-gap"><label>Name</label><input type="text" id="atName"></div>
        <div class="field"><label>Category</label><input type="text" id="atCat" placeholder="e.g. SOC"></div>
        <div class="field"><label>Purpose</label><input type="text" id="atPurpose"></div>
        <div class="field"><label>Install command</label><input type="text" id="atInstall"></div>
        <button class="btn block" onclick="addAdminTool()">Publish tool</button>
      </div>
    </div>

    <div class="card section-gap">
      <div class="h3">User & content management (preview)</div>
      <p class="small" style="margin-top:8px;">In production this connects to REST endpoints such as:</p>
      <div class="termbox section-gap"><pre><span class="p">POST</span> /api/admin/courses
<span class="p">POST</span> /api/admin/notes
<span class="p">POST</span> /api/admin/labs
<span class="p">POST</span> /api/admin/quizzes
<span class="p">GET</span>  /api/admin/users
<span class="p">GET</span>  /api/admin/analytics</pre></div>
    </div>
  `;
}
function addAdminNote(){
  const title=document.getElementById('anTitle').value.trim();
  const cat=document.getElementById('anCat').value.trim()||'General';
  const body=document.getElementById('anBody').value.trim();
  if(!title||!body){ alert('Title and body are required.'); return; }
  STATE.adminNotes.push({id:'a'+Date.now(),title,cat,diff:'beg',body});
  saveState(); render(); nav('notes');
}
function addAdminTool(){
  const name=document.getElementById('atName').value.trim();
  const cat=document.getElementById('atCat').value.trim()||'General';
  const purpose=document.getElementById('atPurpose').value.trim();
  const install=document.getElementById('atInstall').value.trim();
  if(!name||!purpose){ alert('Name and purpose are required.'); return; }
  STATE.adminTools.push({id:'a'+Date.now(),name,cat,purpose,diff:'beg',install:install||'See documentation',cmds:['-- documentation pending --'],doc:'internal'});
  saveState(); render(); nav('tools');
}

function notFound(kind){ return `<div class="card"><div class="h3">${kind} not found</div><a class="btn sm" style="margin-top:12px;" href="#/home">Back home</a></div>`; }

/* ============================== RENDER / ROUTE MAP ============================== */
function render(){
  const parts = route();
  const key = parts[0]||'home';
  let html, active=key;
  switch(key){
    case 'home': html = pageHome(); break;
    case 'roadmap': html = pageRoadmap(); break;
    case 'learn': html = parts[1] ? pageTopic(decodeURIComponent(parts[1])) : pageLearn(); break;
    case 'labs': html = pageLabs(parts[1]?decodeURIComponent(parts[1]):null); active='labs'; break;
    case 'lab': html = pageLabDetail(decodeURIComponent(parts[1]||'')); active='labs'; break;
    case 'ctf': html = pageCtf(); break;
    case 'challenge': html = pageChallenge(decodeURIComponent(parts[1]||'')); active='ctf'; break;
    case 'tools': html = pageTools(parts[1]?decodeURIComponent(parts[1]):null); break;
    case 'notes': html = pageNotes(parts[1]?decodeURIComponent(parts[1]):null); break;
    case 'quizzes': html = pageQuizzes(); break;
    case 'quiz': html = pageQuiz(decodeURIComponent(parts[1]||'')); active='quizzes'; break;
    case 'projects': html = pageProjects(); break;
    case 'career': html = pageCareer(); break;
    case 'progress': html = pageProgress(); break;
    case 'search': html = pageSearch(decodeURIComponent(parts[1]||'')); break;
    case 'profile': html = pageProfile(); break;
    case 'admin': html = pageAdmin(); break;
    default: html = pageHome(); active='home';
  }
  document.getElementById('app').innerHTML = layout(active, html);
  document.documentElement.setAttribute('data-theme', STATE.theme);
}

render();
</script>
</body>
</html>
